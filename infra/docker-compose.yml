version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield_dev
      POSTGRES_DB: digital_shield
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/shield_dev
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4jdata:/data"]

volumes:
  pgdata:
  neo4jdata:
